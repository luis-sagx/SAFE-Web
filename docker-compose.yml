# Despliegue completo en el servidor propio: base de datos, los dos
# microservicios y el frontend, que además hace de gateway.
#
#   cp .env.example .env    # y rellenar los secretos
#   docker compose up -d --build
#
# Las opciones de seguridad siguen el OWASP Docker Security Cheat Sheet:
# ningún contenedor privilegiado, sin escalada de privilegios y con límites de
# recursos para que un fallo no tumbe el servidor entero.

# Nombre fijo: sin esto las imágenes se llaman según el directorio y el escaneo
# del pipeline no las encuentra.
name: safe-web

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # La sintaxis `:?` aborta el arranque con un mensaje claro si falta la
    # variable. Sin esto Postgres arranca con credenciales vacías y el fallo
    # aparece como un contenedor "unhealthy", que no dice cuál es el problema.
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?falta el archivo .env, copiar de .env.example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}"
      POSTGRES_DB: "${POSTGRES_DB:?falta POSTGRES_DB en .env}"
      # Las lee el script de inicialización para crear un rol por servicio.
      IDENTIDAD_DB_PASSWORD: "${IDENTIDAD_DB_PASSWORD:?falta IDENTIDAD_DB_PASSWORD en .env}"
      ENTRENAMIENTO_DB_PASSWORD: "${ENTRENAMIENTO_DB_PASSWORD:?falta ENTRENAMIENTO_DB_PASSWORD en .env}"
    volumes:
      # Postgres 18+ recomienda montar /var/lib/postgresql (no .../data): así
      # los datos quedan en un subdirectorio y un futuro pg_upgrade no choca
      # contra el límite del punto de montaje.
      - pgdata:/var/lib/postgresql
      # Crea un rol y un schema por servicio, sin permisos cruzados. Postgres
      # lo ejecuta solo al inicializar el volumen por primera vez.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    # Sin `ports:`: la base solo es alcanzable desde la red interna de compose.

  # Único servicio que conoce datos personales. Su rol de Postgres no tiene
  # permiso sobre el schema `entrenamiento`, ni al revés.
  identidad:
    build:
      context: ./backend
      args:
        APP: identidad
    restart: unless-stopped
    environment:
      IDENTIDAD_DATABASE_URL: postgresql://identidad:${IDENTIDAD_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=identidad
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET en .env, generar con openssl rand -base64 48}"
      # Solo este servicio lo recibe: es el único que ve una cédula.
      CEDULA_PEPPER: "${CEDULA_PEPPER:?falta CEDULA_PEPPER en .env, generar con openssl rand -base64 48}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      PORT: 3001
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    # Sin `ports:`: solo se alcanza a través de Nginx, en /api/auth/.

  # Los datos del estudio. No tiene ninguna tabla con datos personales ni
  # credenciales para alcanzarlos: por eso el CSV que exporta no puede
  # filtrarlos. Comparte con `identidad` únicamente el JWT_SECRET, para
  # verificar tokens sin llamarlo por red.
  entrenamiento:
    build:
      context: ./backend
      args:
        APP: entrenamiento
    restart: unless-stopped
    environment:
      ENTRENAMIENTO_DATABASE_URL: postgresql://entrenamiento:${ENTRENAMIENTO_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=entrenamiento
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET en .env, generar con openssl rand -base64 48}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      PORT: 3002
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    # Sin `ports:`: solo se alcanza a través de Nginx, en /api/runs/.

  # Sirve la SPA y hace de gateway: es el único contenedor alcanzable desde
  # fuera del servidor.
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-80}:8080'
    depends_on:
      identidad:
        condition: service_healthy
      entrenamiento:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
