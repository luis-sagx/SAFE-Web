allowBuilds:
  unrs-resolver: true
  prisma: true
  '@prisma/engines': true
  esbuild: set this to true or false
  msgpackr-extract: set this to true or false
  workerd: set this to true or false

# El Prisma Client se genera fuera de node_modules (en generated/prisma), así
# que debe poder resolver @prisma/client-runtime-utils desde la raíz del
# proyecto. Con el node_modules aislado de pnpm ese paquete queda dentro del
# store y no se alcanza; hoistearlo es lo que hace funcionar al cliente.
publicHoistPattern:
  - '@prisma/*'

overrides:
  deepmerge-ts: ^8.0.1
  # Prisma CLI 7.10 incorpora estas dependencias transitivas en versiones
  # vulnerables. El override aplica al workspace que construye y ejecuta los
  # dos servicios; los ajustes de la raíz no se heredan aquí.
  mysql2: '>=3.22.0'
  fast-uri: '>=3.1.6'
