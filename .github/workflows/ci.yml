name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Aparecen vulnerabilidades nuevas sin que cambie el código: solo corre
  # `auditoria`. Lunes 06:00 en Ecuador.
  schedule:
    - cron: '0 11 * * 1'

# `main` exige PR con checks en verde y rama al día, así que lo que llega a
# `main` ya se probó tal cual. En `push` solo se repite lo que alimenta el
# análisis de Sonar de la rama principal.
concurrency:
  group: ci-${{ github.ref }}
  # Cancelar en `main` dejaría a Sonar sin analizar algunos merges.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  frontend:
    name: Frontend (lint + pruebas + build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # La acción corre en la raíz del repo, donde no hay package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Con cobertura: Sonar la reutiliza en lugar de correr las pruebas otra vez.
      - run: pnpm test:cov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
      - run: pnpm build

  backend:
    name: Backend (lint + pruebas unitarias)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # El cliente de Prisma se genera en /generated (gitignored); sin esto
      # el linter ve `PrismaClient` como tipo `error` y todo lo que toca
      # revienta con no-unsafe-*.
      - run: pnpm prisma:generate
      # `lint:ci` no lleva --fix: en CI un error no se arregla, se reporta.
      - run: pnpm lint:ci
      - run: pnpm build
      - run: pnpm test:cov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-backend
          path: backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  backend-e2e:
    name: Backend (end-to-end con Postgres)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      IDENTIDAD_DATABASE_URL: postgresql://identidad:ci@localhost:5432/ci_test?schema=identidad
      ENTRENAMIENTO_DATABASE_URL: postgresql://entrenamiento:ci@localhost:5432/ci_test?schema=entrenamiento
      CEDULA_PEPPER: pepper-solo-para-pruebas-de-ci
      EMAIL_PEPPER: email-pepper-solo-para-pruebas-de-ci
      # 32 bytes en base64 de verdad: pii.ts exige ese largo exacto para
      # AES-256-GCM, no vale cualquier cadena como con los peppers de HMAC.
      PII_ENCRYPTION_KEY: x/JbHUIAkT9Ma25gaiyx36wmbuGoAK54pmYLeGFqGE0=
      # No hace falta un dominio verificado ni una API key real: solo dos
      # servicios instancian MailModule al arrancar (identidad y su
      # test module), y ningún test de este job dispara un envío de verdad.
      RESEND_API_KEY: re_dummy_solo_para_que_arranque_en_ci
      # Dummy: NarracionModule vive en el AppModule de identidad, así que
      # config.getOrThrow('CARTESIA_API_KEY') exige que exista para que la
      # app arranque. Ningún test e2e de este job llama a Cartesia de verdad.
      CARTESIA_API_KEY: sk_dummy_solo_para_que_arranque_en_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Claves de usar y tirar, nuevas en cada corrida: no hay un secreto de
      # CI que filtrar ni que rotar.
      - name: Claves JWT de prueba
        run: ../scripts/generate-jwt-keys.sh >> "$GITHUB_ENV"
      # El MISMO script que corre en producción, no una copia: si los permisos
      # entre servicios se aflojan ahí, las pruebas dejan de reflejarlo.
      - name: Un rol y un schema por servicio
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci_test
          PGHOST: localhost
          PGPASSWORD: ci
          IDENTIDAD_DB_PASSWORD: ci
          ENTRENAMIENTO_DB_PASSWORD: ci
        run: ../db-init/01-roles-y-schemas.sh
      - run: pnpm prisma:generate
      - run: pnpm prisma:deploy
      - run: pnpm test:e2e

  auditoria:
    name: Auditoría de dependencias (${{ matrix.proyecto }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        proyecto: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.proyecto }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.proyecto }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Bloquea solo lo que llega al servidor; lo de desarrollo se reporta.
      # El endpoint de asesorías de npm es externo y puede expirar de forma
      # transitoria. Se amplían sus reintentos, pero no se ignoran errores:
      # una vulnerabilidad alta/crítica o una caída persistente siguen fallando.
      - run: >-
          pnpm audit --prod --audit-level high
          --fetch-retries 4
          --fetch-retry-factor 2
          --fetch-retry-mintimeout 10000
          --fetch-retry-maxtimeout 60000
          --fetch-timeout 120000
      - name: Dependencias de desarrollo (informativo)
        if: always()
        continue-on-error: true
        run: pnpm audit --dev --audit-level high

  dependencias-nuevas:
    name: Revisión de dependencias del PR
    runs-on: ubuntu-latest
    # dependency-review-action necesita el grafo de dependencias activado (y en
    # repos privados, GitHub Advanced Security de pago). Si falta cualquiera de
    # los dos rompe el job entero con "Dependency review is not supported on
    # this repository" y tumba el CI del PR. La auditoría real la cubre
    # `pnpm audit` en el job `auditoria`, que sí bloquea por severidad alta, así
    # que este job es informativo y nunca debe hacer fallar el CI.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  sonar:
    name: SonarQube Cloud (SAST + cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Solo para descargar la cobertura que ya generaron esos jobs.
    needs: [frontend, backend]
    # Los secretos no se exponen a PRs desde forks. Esos PRs mantienen los
    # demás controles del CI; el análisis completo corre tras integrarse.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      # Sin pruebas aquí: el análisis de tipos solo necesita dependencias y el
      # cliente de Prisma generado.
      - run: pnpm --dir backend prisma:generate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cobertura-frontend
          path: frontend/coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cobertura-backend
          path: backend/coverage
      - name: Análisis y Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # El gate bloquea en el PR, donde todavía se puede corregir. En
          # `main` el código ya entró: el análisis se publica y el estado del
          # gate se consulta en SonarCloud, sin dejar el CI en rojo.
          args: >
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
            -Dsonar.qualitygate.timeout=300

  docker:
    name: Imágenes Docker (build + arranque + escaneo)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend, backend-e2e]
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      IDENTIDAD_DB_PASSWORD: ci-identidad
      ENTRENAMIENTO_DB_PASSWORD: ci-entrenamiento
      CEDULA_PEPPER: ci-pepper-solo-para-pruebas
      EMAIL_PEPPER: ci-email-pepper-solo-para-pruebas
      # 32 bytes en base64 de verdad: pii.ts exige ese largo exacto para
      # AES-256-GCM, no vale cualquier cadena como con los peppers de HMAC.
      PII_ENCRYPTION_KEY: mpq/ulhvUPNvL338nlw/zfHifGEPPcMXI3vGoSZ8WYo=
      WEB_PORT: 8080
      # Dummy: este job levanta el compose real, así que MailService.getOrThrow
      # exige que la variable exista. No hace falta que sea válida — si algo
      # dispara un envío de correo aquí, Resend responde 401 y el catch de
      # MailService lo absorbe (mismo diseño que en producción).
      RESEND_API_KEY: re_dummy_solo_para_que_arranque_en_ci
      # Mismo motivo: NarracionService.getOrThrow la exige para arrancar.
      # Si algo llega a pedir el saludo en este job, Cartesia responde 401
      # y ese endpoint devuelve 500 — no rompe nada más del smoke test.
      CARTESIA_API_KEY: sk_car_dummy_solo_para_que_arranque_en_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker compose exige las claves para interpolar el archivo, incluso
      # para `build`. Nuevas en cada corrida.
      - name: Claves JWT de prueba
        run: scripts/generate-jwt-keys.sh >> "$GITHUB_ENV"

      - run: docker compose build

      # Docker Hub corta conexiones de vez en cuando (`connection reset by
      # peer`) y tumbaba el job sin que nada del repo estuviera mal. Se bajan
      # aquí, con reintentos, las imágenes que después usan `up` y k6.
      - name: Descargar imágenes de Docker Hub (con reintentos)
        run: |
          for intento in 1 2 3; do
            docker compose pull db && docker pull grafana/k6:2.1.0 && exit 0
            echo "Intento $intento fallido; reintentando en 15 s"
            sleep 15
          done
          exit 1

      # --wait respeta los HEALTHCHECK: falla si el API no aplica las
      # migraciones o si Nginx no levanta.
      - run: docker compose up -d --wait --wait-timeout 180

      - name: API a través de Nginx
        run: curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'

      - name: Frontend servido
        run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'

      - name: Enrutado de la SPA
        run: curl -fsS http://localhost:8080/dashboard > /dev/null

      # Un token emitido por `identidad` tiene que servir en `entrenamiento`
      # sin que se llamen entre sí: es el contrato de los dos microservicios,
      # y la única forma de verificarlo es a través del gateway real.
      - name: Registro y corrida contra la pila real
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"nombre":"Prueba","apellido":"CI","email":"ci@ejemplo.ec","cedula":"1710034065","password":"Clave-Larga-123!"}' \
            > /dev/null

          # El registro ya no entrega sesión (issue #295): la cuenta queda sin
          # confirmar, y el correo real no se puede leer desde este smoke
          # test (Resend usa una clave dummy aquí). Se confirma directo en la
          # base, mismo patrón que ya usa el paso de abajo para hablar con
          # Postgres a través del contenedor.
          docker compose exec -T -e PGPASSWORD=ci-identidad db \
            psql -U identidad -d ci -h 127.0.0.1 \
            -c 'UPDATE identidad."Participant" SET "emailConfirmedAt" = now() WHERE email IS NOT NULL;'

          token=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@ejemplo.ec","password":"Clave-Larga-123!"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          curl -fsS -X POST http://localhost:8080/api/runs \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"scenarioId":"phishing/factura-sri","version":1,"outcome":"CORRECTO","score":100,"endingId":"e_verifica","durationMs":1000,"startedAt":"2026-08-01T10:00:00.000Z","decisions":[]}' \
            > /dev/null

      # Flujo nominal reproducible: la tasa mantiene cada servicio por debajo
      # de su límite de 120 solicitudes/minuto por IP y fija SLOs de error y
      # latencia mediante los thresholds del script.
      - name: Carga nominal con k6
        id: k6
        run: |
          docker run --rm \
            -e BASE_URL=http://host.docker.internal:8080 \
            --add-host=host.docker.internal:host-gateway \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            grafana/k6:2.1.0 run \
            --summary-export /work/k6-nominal-summary.json \
            tests/carga/nominal.js

      # Se publica también si k6 falla sus thresholds (el resumen explica por
      # qué), pero no si k6 ni llegó a correr: ahí no hay archivo y el error
      # de "No files were found" solo tapaba el fallo real de un paso anterior.
      - name: Publicar resumen de k6
        if: always() && steps.k6.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-nominal-summary
          path: k6-nominal-summary.json
          if-no-files-found: error

      # La garantía de privacidad del estudio, verificada contra la base real:
      # el rol del servicio de entrenamiento no puede alcanzar los datos
      # personales ni con SQL crudo. Si alguien afloja los permisos del
      # db-init, esto falla.
      - name: El servicio del estudio no alcanza los datos personales
        run: |
          if docker compose exec -T -e PGPASSWORD=ci-entrenamiento db \
            psql -U entrenamiento -d ci -h 127.0.0.1 \
            -c 'SELECT nombre FROM identidad."Participant";' 2>/dev/null; then
            echo 'FALLO: el rol entrenamiento pudo leer identidad."Participant"'
            exit 1
          fi
          echo 'OK: permiso denegado, como debe ser.'

      - name: Registros de los contenedores si algo falló
        if: failure()
        run: docker compose logs --no-color --tail 200

      # Informativo: casi todo lo que sale es de las imágenes base y no se
      # arregla desde este repositorio. Lo propio lo bloquea `auditoria`.
      - name: Vulnerabilidades de las imágenes (informativo)
        continue-on-error: true
        run: |
          for imagen in safe-web-identidad safe-web-entrenamiento safe-web-web; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.69.3@sha256:7228e304ae0f610a1fad937baa463598cadac0c2ac4027cc68f3a8b997115689 image \
              --scanners vuln --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 0 \
              "$imagen"
          done

      # Un secreto horneado en la imagen sí es un fallo de este repositorio.
      - name: Secretos horneados en las imágenes
        run: |
          for imagen in safe-web-identidad safe-web-entrenamiento safe-web-web; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.69.3@sha256:7228e304ae0f610a1fad937baa463598cadac0c2ac4027cc68f3a8b997115689 image \
              --scanners secret --exit-code 1 \
              --severity HIGH,CRITICAL \
              "$imagen"
          done

      - if: always()
        run: docker compose down -v

  # Único check requerido por la regla de `main`. Un job omitido por `if`
  # cuenta como éxito para GitHub: requerir `sonar` o `docker` directamente
  # dejaría pasar un PR cuando se omiten porque falló un job anterior.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [frontend, backend, backend-e2e, auditoria, sonar, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
