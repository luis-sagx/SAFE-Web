server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx es el gateway: enruta por prefijo hacia cada microservicio. El
    # frontend y el API comparten origen, así que no hace falta CORS en
    # producción y ningún servicio de aplicación queda expuesto al exterior.
    #
    # Las cabeceras van en un archivo aparte porque `proxy_set_header` no se
    # hereda: declarar una sola dentro de un `location` descarta todas las del
    # nivel superior, y las peticiones llegarían sin la IP real.
    # Sin barra final en el prefijo: con `/api/runs/` nginx no casa `/api/runs`
    # a secas, cae en el `location /` de la SPA y responde un 301 — que es
    # justo la ruta del POST que registra una corrida.
    location /api/auth {
        proxy_pass http://identidad:3001/api/auth;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # Gestión de cuentas (solo supervisor). La atiende identidad, dueño de la
    # tabla de participantes.
    location /api/admin {
        proxy_pass http://identidad:3001/api/admin;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    location /api/runs {
        proxy_pass http://entrenamiento:3002/api/runs;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # Health check de la plataforma: responde el servicio de identidad, que es
    # el que atiende el primer paso del usuario.
    location = /api/health {
        proxy_pass http://identidad:3001/api/health;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # SPA: cualquier ruta desconocida la resuelve React Router en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        # add_header no se hereda: al declarar uno aquí se pierden los del
        # server. Se repiten para que los assets no salgan sin cabeceras de
        # seguridad (sniffing de MIME sobre un .js, sobre todo).
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # La SPA sirve un único script externo y CSS externo; no hay <script>
    # inline, así que `script-src 'self'` no rompe nada. `style-src` permite
    # inline por los `style=` de React; `img-src data:` por los SVG/QR en línea.
    # Si algún XSS lograra inyectar markup, el navegador no ejecutaría script
    # externo ni inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Solo surte efecto sobre HTTPS (el navegador la ignora sobre HTTP). El TLS
    # lo termina el reverse proxy del servidor propio.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
