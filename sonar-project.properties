# Un único proyecto SonarQube Cloud para la SPA y los dos microservicios.
# Las claves se corresponden con el proyecto que ya se importó desde GitHub.
sonar.organization=luis-sagx
sonar.projectKey=luis-sagx_SAFE-Web
sonar.projectName=SAFE-Web
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src,backend/apps,backend/libs
# Test files are analyzed for coverage, but must not count as production source
# for duplication and maintainability metrics. Keeping them in the test scope
# prevents repeated fixtures and mocks from failing the Quality Gate.
sonar.tests=frontend/src,backend/apps,backend/libs
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,backend/generated/**,**/coverage/**,frontend/public/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test/**
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
